name: AIO Node CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  host-tests:
    name: Host Unit Tests (PC SiL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc cppcheck python3

      - name: Static analysis (Cppcheck + MISRA C:2012 addon)
        run: |
          cppcheck --addon=misra.json --error-exitcode=1 \
            -I include src/core/

      - name: Configure CMake (Host)
        run: |
          cmake -B build \
            -DAIO_BUILD_HOST_TESTS=ON \
            -DAIO_BUILD_HOST_SIMULATOR=ON \
            -DAIO_BUILD_MCU=OFF \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build Host Targets
        run: cmake --build build -j$(nproc)

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure

  mcu-build:
    name: STM32 Firmware Build (HiL target)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure CMake (MCU)
        run: |
          rm -rf build-mcu
          cmake -B build-mcu \
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
          -DAIO_BUILD_MCU=ON \
          -DAIO_BUILD_HOST_TESTS=OFF \
          -DAIO_BUILD_HOST_SIMULATOR=OFF \
          -DCMAKE_BUILD_TYPE=Release

      - name: Build MCU Firmware
        run: cmake --build build-mcu -j$(nproc)

      - name: Report Memory Footprint
        run: |
          arm-none-eabi-size build-mcu/aio_fw
          echo "--- Artifacts ---"
          ls -lh build-mcu/aio_fw.* || true

      - name: Upload Firmware Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aio-fw-stm32f103
          path: |
            build-mcu/aio_fw.hex
            build-mcu/aio_fw.bin
            build-mcu/aio_fw.map
