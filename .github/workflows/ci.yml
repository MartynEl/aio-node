name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Current verified firmware is several KB.
  # Budget is intentionally conservative but not razor-thin.
  # Adjust after Stage 3.1 if needed.
  MAX_FW_BYTES: 32768
  MAX_RAM_BYTES: 16384

jobs:
  host-tests:
    name: Host tests and SiL verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure host test build
        run: |
          cmake -S . -B build-host \
            -DAIO_BUILD_MCU=OFF \
            -DAIO_BUILD_HOST_TESTS=ON \
            -DAIO_BUILD_HOST_SIMULATOR=ON \
            -DCMAKE_BUILD_TYPE=Testing

      - name: Build host tests
        run: |
          cmake --build build-host --parallel "$(nproc)"

      - name: Run CTest suites
        run: |
          ctest --test-dir build-host --output-on-failure

      - name: Show host test summary
        if: always()
        run: |
          echo "CTest reports suite-level results."
          echo "Current project structure: 3 CTest suites / 12 internal test cases."
          echo "Suites: filter, pid, wear_leveling."

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run portable Cppcheck analysis
        continue-on-error: true
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --unified=yes \
            -I include \
            src/ \
            2> cppcheck-report.txt || true

          if [ -s cppcheck-report.txt ]; then
            echo "Cppcheck findings:"
            cat cppcheck-report.txt
          else
            echo "Cppcheck produced no findings."
          fi

      - name: Run MISRA-oriented Cppcheck addon on portable core layer
        continue-on-error: true
        run: |
          if [ -f misra.json ]; then
            echo "Running MISRA addon on src/core only."
            echo "Scope note: platform/app/service layers are not gated by MISRA addon in this CI job."
            cppcheck \
              --addon=misra.json \
              --inline-suppr \
              --suppress=missingIncludeSystem \
              --unified=yes \
              -I include \
              src/core/ \
              2> cppcheck-misra-report.txt || true

            if [ -s cppcheck-misra-report.txt ]; then
              echo "MISRA addon findings:"
              cat cppcheck-misra-report.txt
            else
              echo "MISRA addon produced no findings."
            fi
          else
            echo "misra.json not found. Skipping MISRA addon."
          fi

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          retention-days: 7
          path: |
            cppcheck-report.txt
            cppcheck-misra-report.txt

  mcu-build:
    name: STM32 firmware build and release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Verify toolchain
        run: |
          arm-none-eabi-gcc --version
          cmake --version

      - name: Configure MCU build
        run: |
          cmake -S . -B build-mcu \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DAIO_BUILD_MCU=ON \
            -DAIO_BUILD_HOST_TESTS=OFF \
            -DAIO_BUILD_HOST_SIMULATOR=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build MCU firmware
        run: |
          cmake --build build-mcu --parallel "$(nproc)"

      - name: Ensure hex/bin artifacts exist
        run: |
          if [ ! -f build-mcu/aio_fw ]; then
            echo "ERROR: build-mcu/aio_fw not found"
            exit 1
          fi

          if [ ! -f build-mcu/aio_fw.hex ]; then
            arm-none-eabi-objcopy -O ihex build-mcu/aio_fw build-mcu/aio_fw.hex
          fi

          if [ ! -f build-mcu/aio_fw.bin ]; then
            arm-none-eabi-objcopy -O binary build-mcu/aio_fw build-mcu/aio_fw.bin
          fi

          ls -lh build-mcu/aio_fw build-mcu/aio_fw.hex build-mcu/aio_fw.bin || true

      - name: Report memory footprint
        run: |
          arm-none-eabi-size build-mcu/aio_fw | tee size-report.txt

      - name: Enforce firmware memory budget
        run: |
          TOTAL=$(awk 'NR==2 {print $1+$2+$3}' size-report.txt)
          DATA=$(awk 'NR==2 {print $2}' size-report.txt)
          BSS=$(awk 'NR==2 {print $3}' size-report.txt)
          RAM=$((DATA + BSS))

          echo "Flash text+data+bss = ${TOTAL} bytes"
          echo "RAM data+bss = ${RAM} bytes"

          if [ "${TOTAL}" -gt "${MAX_FW_BYTES}" ]; then
            echo "ERROR: firmware size ${TOTAL} exceeds budget ${MAX_FW_BYTES}"
            exit 1
          fi

          if [ "${RAM}" -gt "${MAX_RAM_BYTES}" ]; then
            echo "ERROR: RAM usage ${RAM} exceeds budget ${MAX_RAM_BYTES}"
            exit 1
          fi

      - name: Upload firmware build artifact
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: aio-fw-${{ github.sha }}
          retention-days: 14
          path: |
            build-mcu/aio_fw
            build-mcu/aio_fw.hex
            build-mcu/aio_fw.bin
            build-mcu/aio_fw.map
            size-report.txt

      - name: Create GitHub Release with firmware artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-mcu/aio_fw.hex
            build-mcu/aio_fw.bin